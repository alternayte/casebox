name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just checks

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just cli

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just web

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Pull images up front so container start-up does not count against test timeouts.
      - name: Pull test images
        run: |
          grep -rhoE '"(postgres|ghcr\.io/alternayte/queuebox):[^"]+"' server/Casebox.Server.Tests | tr -d '"' | sort -u | xargs -n1 docker pull
      - run: just server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: artifacts/**/TestResults/**
          if-no-files-found: ignore

# The CLI's release binaries: every v* tag builds one static binary per platform (no CGO), packs
# it with its checksum, and publishes a GitHub release. A tag with a hyphen (v0.1.0-trial.1) is a
# pre-release. docs/public/install.sh and install.ps1 install from these releases. The images
# workflow builds the server image of the same version from the same tag, so `casebox up` of a
# release runs the matching server. Step 17 adds signing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="casebox_${version}_${os}_${arch}"
            exe=casebox; [[ "$os" == windows ]] && exe=casebox.exe
            mkdir -p "build/$name"
            (cd cli && GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/alternayte/casebox/cli/internal/buildinfo.Version=$version" \
              -o "../build/$name/$exe" ./cmd/casebox)
            cp cli/LICENSE "build/$name/"
            if [[ "$os" == windows ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"

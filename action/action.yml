# Casebox harness CI (docs/specs/harness-ci.md). On a pull request that changes harness files it
# runs the smoke suite with the pull request's harness against the cached baseline; the server posts
# the result as a comment. On a schedule it scores the default branch's harness: the baseline.
name: Casebox harness CI
description: Test a pull request's harness change on your own cases before it merges.
author: alternayte
branding:
  icon: check-circle
  color: gray-dark

inputs:
  server:
    description: The Casebox server URL.
    required: true
  token:
    description: A ci token, from `casebox token create --kind ci --name <name>` (an Admin).
    required: true
  mode:
    description: pull_request, baseline or propose (the weekly proposer). The default is pull_request on pull request events and baseline otherwise.
    required: false
    default: ""
  worker:
    description: inline runs this CI run's jobs on this runner's Docker, with the model keys in the job's env; none leaves them to the organisation's workers.
    required: false
    default: none
  fail-on:
    description: regression fails the job when the smoke run finds a regression; none keeps the check neutral.
    required: false
    default: none
  timeout:
    description: How long to follow the CI run, as a Go duration.
    required: false
    default: 90m
  go-version:
    description: The Go version that builds the Casebox CLI from this action's source.
    required: false
    default: 1.26.x

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ github.action_path }}/../cli/go.sum
    - name: Build the Casebox CLI
      shell: bash
      working-directory: ${{ github.action_path }}/../cli
      env:
        CGO_ENABLED: "0"
      run: go build -o "$RUNNER_TEMP/casebox" ./cmd/casebox
    - name: Run harness CI
      shell: bash
      env:
        CASEBOX_SERVER: ${{ inputs.server }}
        CASEBOX_TOKEN: ${{ inputs.token }}
        CASEBOX_HOME: ${{ runner.temp }}/casebox-home
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKER: ${{ inputs.worker }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        mode="$INPUT_MODE"
        if [ -z "$mode" ]; then
          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_target) mode=pull_request ;;
            *) mode=baseline ;;
          esac
        fi
        case "$mode" in
          baseline) args=(ci --baseline --worker "$INPUT_WORKER" --timeout "$INPUT_TIMEOUT") ;;
          pull_request) args=(ci --worker "$INPUT_WORKER" --fail-on "$INPUT_FAIL_ON" --timeout "$INPUT_TIMEOUT") ;;
          propose) args=(propose --scheduled --worker "$INPUT_WORKER" --timeout "$INPUT_TIMEOUT") ;;
          *) echo "mode must be pull_request, baseline or propose, not $mode" >&2; exit 2 ;;
        esac
        "$RUNNER_TEMP/casebox" "${args[@]}"

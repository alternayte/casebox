# QueueBox for Casebox: every webhook and poll result enters through the inbox. Nothing leaves
# through the outbox. Secrets come from the environment.

server:
  httpPort: 8080
  managementPort: 9090

# The URL, user and password come from QUEUEBOX_DATABASE_URL, _USERNAME and _PASSWORD.
database:
  type: postgresql
  migrate: true

outbox:
  # Retries back off exponentially; the eighth failure dead-letters the row.
  maxAttempts: 8

inbox:
  basePath: /inbox
  relay:
    enabled: false

admin:
  enabled: true
  auth:
    type: bearer
    token: ${CASEBOX_QUEUEBOX_ADMIN_TOKEN}

sources:
  # GitHub App webhooks, after the server checked their HMAC and reduced each delivery to a notice
  # that holds no identity. GitHub's delivery ID is the idempotency key, so a redelivery is stored once.
  github:
    type: http
    path: /github
    idempotencyKeyHeader: X-GitHub-Delivery
    eventTypeHeader: X-GitHub-Event
    consumption: pull
    auth:
      type: bearer
      token: ${CASEBOX_POLL_TOKEN}

  # The server's GitHub and Jira pollers. A repeated poll of the same state has the same key and
  # is stored once.
  poll:
    type: http
    path: /poll
    idempotencyKeyPath: $.key
    eventTypePath: $.type
    consumption: pull
    auth:
      type: bearer
      token: ${CASEBOX_POLL_TOKEN}

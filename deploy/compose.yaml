# The local stack that `casebox up` starts: server, QueueBox and Postgres on one database.
# QueueBox is pinned by version; checks/queuebox-pin.sh keeps the server tests on the same image.
name: casebox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casebox
      POSTGRES_USER: casebox
      POSTGRES_PASSWORD: ${CASEBOX_DB_PASSWORD:-casebox}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebox -d casebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  queuebox:
    image: ghcr.io/alternayte/queuebox:0.6.0
    environment:
      QUEUEBOX_CONFIG_FILE: /etc/queuebox/queuebox.yml
      QUEUEBOX_DATABASE_URL: jdbc:postgresql://postgres:5432/casebox
      QUEUEBOX_DATABASE_USERNAME: casebox
      QUEUEBOX_DATABASE_PASSWORD: ${CASEBOX_DB_PASSWORD:-casebox}
      CASEBOX_QUEUEBOX_ADMIN_TOKEN: ${CASEBOX_QUEUEBOX_ADMIN_TOKEN:?set CASEBOX_QUEUEBOX_ADMIN_TOKEN}
      CASEBOX_EFFECTS_URL: http://server:8081
      CASEBOX_EFFECTS_TOKEN: ${CASEBOX_EFFECTS_TOKEN:?set CASEBOX_EFFECTS_TOKEN}
      CASEBOX_POLL_TOKEN: ${CASEBOX_POLL_TOKEN:?set CASEBOX_POLL_TOKEN}
    volumes:
      - ./queuebox.yml:/etc/queuebox/queuebox.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ${CASEBOX_SERVER_IMAGE:-ghcr.io/alternayte/casebox-server:${CASEBOX_VERSION:-dev}}
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      ConnectionStrings__Casebox: Host=postgres;Database=casebox;Username=casebox;Password=${CASEBOX_DB_PASSWORD:-casebox}
      ASPNETCORE_URLS: http://+:8080
      Casebox__Keys__Mode: database
      Casebox__LocalAdmin__Password: ${CASEBOX_ADMIN_PASSWORD:?set CASEBOX_ADMIN_PASSWORD}
      Casebox__QueueBox__BaseUrl: http://queuebox:8080
      Casebox__QueueBox__HealthUrl: http://queuebox:9090/health
      Casebox__QueueBox__PollToken: ${CASEBOX_POLL_TOKEN}
      Casebox__QueueBox__EffectsToken: ${CASEBOX_EFFECTS_TOKEN}
      Casebox__Demo: ${CASEBOX_DEMO:-false}
    ports:
      - "${CASEBOX_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      queuebox:
        condition: service_healthy

volumes:
  postgres:

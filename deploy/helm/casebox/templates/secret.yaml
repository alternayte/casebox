{{- if not .Values.existingSecret }}
{{- $name := include "casebox.tokensSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "casebox.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "poll-token" "queuebox-admin-token" }}
  {{- if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}

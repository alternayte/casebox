extends: script
message: "Open each page with what the reader achieves or learns: 'This page ...', 'This guide ...', 'This runbook ...', or 'In this tutorial ...'."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  body := text.split(scope, "\n---\n")
  if len(body) > 1 {
    rest := body[1]
    lines := text.split(rest, "\n")
    for line in lines {
      t := text.trim_space(line)
      if t == "" || text.has_prefix(t, "import ") { continue }
      if !(text.has_prefix(t, "This ") || text.has_prefix(t, "In this tutorial") || text.has_prefix(t, "Casebox is") || text.has_prefix(t, "<")) {
        matches = append(matches, {begin: 0, end: 1})
      }
      break
    }
  }

# .github/workflows/harness-ci.yml: Casebox harness CI for a repository enrolled in a workspace.
# Pull requests that change harness files get a smoke run and a comment; the schedule keeps the
# default branch's baseline scored, so a pull request runs only its own side.
name: Harness CI

on:
  pull_request:
    paths: ["AGENTS.md", "CLAUDE.md", ".cursor/rules/**", ".claude/skills/**", ".agents/skills/**", ".mcp.json", ".casebox/casebox.yml"]
  schedule:
    - cron: "17 3 * * *" # nightly: the baseline
    - cron: "47 4 * * 1" # weekly: the proposer, and the harness diet once a quarter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: alternayte/casebox/action@v0
        with:
          server: ${{ vars.CASEBOX_SERVER }}
          token: ${{ secrets.CASEBOX_TOKEN }}
          mode: ${{ github.event.schedule == '47 4 * * 1' && 'propose' || '' }}
          worker: inline # optional: runs the jobs on this runner's Docker
          # fail-on: regression
        env:
          # The inline worker's model key and its clone token; the server never sees either.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The proposer's analysis model (docs/specs/steering.md, The analysis model).
          CASEBOX_ANALYSIS_PROVIDER: anthropic
          CASEBOX_ANALYSIS_MODEL: ${{ vars.CASEBOX_ANALYSIS_MODEL }}
          GITHUB_TOKEN: ${{ secrets.CASEBOX_GITHUB_TOKEN || github.token }}

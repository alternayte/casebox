# Deedbox event contracts. EventContracts.Verify writes this file; commit it.

stream case (Case)
  case.approved v1 { by: string }
  case.assertions_approved v1 { assertions: [{ kind: string, path: string?, pattern: string? }], by: string, judge: [{ question: string }] }
  case.instruction_drafted v1 { assertions: [{ kind: string, path: string?, pattern: string? }], judge: [{ question: string }], model: string, person: string, signatures: [string], text: string? pd(person) }
  case.instruction_edited v1 { by: string, person: string, text: string? pd(person) }
  case.mined v1 { harnessHash: string, kind: enum{Capability=0, Regression=1, Steering=2}, rank: int32, recipeHash: string, repos: [{ base: string, merged: string?, repo: string, role: enum{Sealed=0, Context=1} }], scope: enum{Single=0, Split=1, Multi=2}, source: string, workItem: string?, workspace: string }
  case.rejected v1 { by: string, reason: string }
  case.retired v1 { reason: enum{Environment=0, Drift=1, Manual=2} }
  case.split_assigned v1 { split: enum{Dev=0, HeldOut=1} }
  case.validated v1 { drift: bool, failToPass: int32, oracle: string, passToPass: int32, seconds: float64, weight: float64 }
  case.validation_failed v1 { detail: string?, reason: enum{Build=0, NoFailToPass=1, FailToPassPassedAtBase=2, Flaky=3, TooSlow=4, FixDoesNotFail=5, ApplyFailed=6} }

stream evaluation (Evaluation)
  evaluation.budget_exhausted v1 { spentUsd: decimal }
  evaluation.cancelled v1 { by: string, reason: string }
  evaluation.checkpoint_evaluated v1 { cases: int32, delta: float64, level: float64, lower: float64, round: int32, upper: float64, verdict: enum{Better=0, Worse=1, Equivalent=2, Inconclusive=3} }
  evaluation.confirmed v1 { by: string }
  evaluation.requested v1 { baseline: { agent: string, agentVersion: string, command: { logFormat: string?, logGlob: string?, template: string }?, effort: string?, harness: string, model: string, settings: { maxTurns: int32?, timeoutMinutes: int32?, tokenCap: int64? } }, candidate: { agent: string, agentVersion: string, command: { logFormat: string?, logGlob: string?, template: string }?, effort: string?, harness: string, model: string, settings: { maxTurns: int32?, timeoutMinutes: int32?, tokenCap: int64? } }, capUsd: decimal, cases: [{ caseId: string, weight: float64 }], change: string, delta: float64, estimate: { baselineTokens: int64, baselineUsd: decimal, candidateTokens: int64, candidateUsd: decimal, cases: int32, detectableEffect: float64?, maxMinutes: float64, minMinutes: float64, perRoundUsd: decimal, runs: int32, sandboxMinutes: float64, totalUsd: decimal }, mutableModel: bool, needsConfirmation: bool, prices: map<{ cacheRead: decimal?, cacheWrite: decimal?, input: decimal, output: decimal }>, purpose: enum{Compare=0, HarnessVsNone=1, HarnessCi=2, Gate=3}, repeats: int32, split: string, workspace: string }
  evaluation.run_completed v1 { caseId: string, costUsd: decimal, evidence: string, passed: bool, repeat: int32, runId: string, seconds: float64, side: enum{Baseline=0, Candidate=1}, tokens: int64 }
  evaluation.run_failed v1 { caseId: string, reason: string, repeat: int32, runId: string, side: enum{Baseline=0, Candidate=1} }
  evaluation.verdict_reached v1 { baselineRate: float64, candidateRate: float64, cases: int32, costLower: float64?, costRatio: float64?, costUpper: float64?, delta: float64, durationLower: float64?, durationRatio: float64?, durationUpper: float64?, equivalentAndCheaper: bool, level: float64, lower: float64, reason: string?, runs: int32, upper: float64, verdict: enum{Better=0, Worse=1, Equivalent=2, Inconclusive=3} }

stream org (Organisation)
  org.created v1 { name: string, settings: { budgets: { confirmAboveUsd: decimal, monthlyUsd: decimal, perEvaluationUsd: decimal }, k: int32, promptMode: enum{Off=0, Redacted=1, Full=2}?, pseudonymPeriod: enum{Month=0, Quarter=1, Year=2}, retentionMonths: int32?, traceRetentionDays: int32? } }
  org.erasure_performed v1 { sessions: int32, subjects: int32 }
  org.integration_configured v1 { connected: bool, kind: string }
  org.member_role_changed v1 { accountId: string, role: enum{Viewer=0, Member=1, Admin=2, Owner=3} }
  org.period_retired v1 { period: string, subjects: int32 }
  org.settings_changed v1 { settings: { budgets: { confirmAboveUsd: decimal, monthlyUsd: decimal, perEvaluationUsd: decimal }, k: int32, promptMode: enum{Off=0, Redacted=1, Full=2}?, pseudonymPeriod: enum{Month=0, Quarter=1, Year=2}, retentionMonths: int32?, traceRetentionDays: int32? } }
  org.token_issued v1 { kind: string, name: string, tokenId: string }
  org.token_revoked v1 { tokenId: string }

stream steering (SteeringState)
  steering.classified v1 { confidence: float64, intent: enum{Correction=0, Direction=1, Clarification=2, Routine=3}, interventionId: string, model: string, prevention: enum{Instruction=0, Skill=1, ToolAccess=2, Verification=3, ClearerTicket=4, StrongerModel=5, Nothing=6}?, promptVersion: string, wentWrong: enum{MissedRequirement=0, BrokeConvention=1, WrongApproach=2, UnverifiedDone=3, WrongArea=4, OverEngineered=5, LackedDomainKnowledge=6, Environment=7, Other=8}?, wentWrongLabel: string? }
  steering.observed v1 { at: date-time, interventionId: string, number: int32?, period: string, person: string, personMapped: bool, phase: enum{InSession=0, BeforeMerge=1, AfterMerge=2}, refs: { commentId: int64?, commits: [string]?, restartedBy: string?, seqs: [int64]? }, repo: string, ruleIntent: enum{Correction=0, Direction=1, Clarification=2, Routine=3}?, sessionId: string?, signal: enum{FollowUp=0, Interruption=1, Denial=2, Rewind=3, HumanEdit=4, Abandoned=5, Restarted=6, HumanRewrite=7, ReviewChange=8, CiFix=9, Revert=10, Fix=11}, text: string? pd(person) }
  steering.relabeled v1 { by: string, intent: enum{Correction=0, Direction=1, Clarification=2, Routine=3}, interventionId: string, person: string, prevention: enum{Instruction=0, Skill=1, ToolAccess=2, Verification=3, ClearerTicket=4, StrongerModel=5, Nothing=6}?, wentWrong: enum{MissedRequirement=0, BrokeConvention=1, WrongApproach=2, UnverifiedDone=3, WrongArea=4, OverEngineered=5, LackedDomainKnowledge=6, Environment=7, Other=8}?, wentWrongLabel: string? }
  steering.unclassified v1 { confidence: float64?, interventionId: string, model: string?, promptVersion: string?, reason: enum{NoText=0, LowConfidence=1, InvalidOutput=2, ModelError=3} }

stream work_item (WorkItem)
  work_item.ci_observed v1 { at: date-time, check: string, conclusion: string, number: int32, repo: string, sha: string }
  work_item.fix_observed v1 { at: date-time, fixedBy: string, lines: int32, number: int32, repo: string, source: enum{Explicit=0, Branch=1, PullRequest=2, SameBranch=3, SameWorkItem=4} }
  work_item.imported v1 { createdAt: date-time, key: string, provider: string, repo: string? }
  work_item.merged v1 { at: date-time, number: int32, repo: string, sha: string }
  work_item.pr_linked v1 { confidence: enum{Low=0, High=1, Explicit=2}, number: int32, repo: string, source: enum{Explicit=0, Branch=1, PullRequest=2, SameBranch=3, SameWorkItem=4} }
  work_item.revert_observed v1 { at: date-time, number: int32, repo: string, revertedBy: string }
  work_item.review_observed v1 { at: date-time, comments: int32, number: int32, repo: string, reviewId: int64, reviewer: string, state: string }
  work_item.session_linked v1 { confidence: enum{Low=0, High=1, Explicit=2}, sessionId: string, source: enum{Explicit=0, Branch=1, PullRequest=2, SameBranch=3, SameWorkItem=4} }
  work_item.session_reassigned v1 { sessionId: string, toWorkItem: string }
  work_item.snapshot_captured v1 { reason: enum{FirstLinked=0, WorkStarted=1, TextChanged=2, Resolved=3}, snapshot: { assignee: string?, description: string?, hash: string, labels: [string], resolved: bool, status: string?, title: string, type: string? } }

stream workspace (Workspace)
  workspace.created v1 { name: string }
  workspace.recipe_confirmed v1 { hash: string }
  workspace.recipe_proposed v1 { hash: string, recipe: string }
  workspace.recipe_validated v1 { hash: string, passed: bool, reportBlob: string? }
  workspace.repo_added v1 { repo: string }
  workspace.repo_removed v1 { repo: string }
